name: Day 03 extras source probe
on:
  push:
    branches: ["feat/day03-four-more-polygons"]
    paths: [".github/workflows/day03-extras-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe catchment names and item provenance
        shell: bash
        run: |
          set +e
          WB='https://services3.arcgis.com/Bb8lfThdhugyc4G3/ArcGIS/rest/services/England_WFD_River_Water_Body_Catchments_Cycle_3/FeatureServer/0'
          curl -s "$WB?f=json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("item", d.get("serviceItemId"))'
          curl -s -G "$WB/query" --data-urlencode 'where=1=1' --data-urlencode 'geometry=290000,440000,480000,670000' \
            --data-urlencode 'geometryType=esriGeometryEnvelope' --data-urlencode 'inSR=27700' \
            --data-urlencode 'outFields=RBD_NAME,MNCAT_NAME' --data-urlencode 'returnDistinctValues=true' \
            --data-urlencode 'returnGeometry=false' --data-urlencode 'f=json' | python3 -c 'import json,sys
          d=json.load(sys.stdin)
          for f in sorted(d.get("features",[]), key=lambda f:(f["attributes"]["RBD_NAME"],f["attributes"]["MNCAT_NAME"])): print("CAT", f["attributes"])
          print(d.get("error"))'
          curl -s -G "$WB/query" --data-urlencode 'where=1=1' --data-urlencode 'returnCountOnly=true' --data-urlencode 'f=json'; echo
          for item in $(curl -s "$WB?f=json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["serviceItemId"])') 54b7adec13ae4710a018c5d5590993a0; do
            curl -s "https://www.arcgis.com/sharing/rest/content/items/$item?f=json" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ITEM", {k:d.get(k) for k in ["title","owner","orgId","accessInformation","licenseInfo","modified","url"]})'
          done
          curl -s 'https://www.arcgis.com/sharing/rest/portals/Bb8lfThdhugyc4G3?f=json' | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ORG", d.get("name"), d.get("urlKey"))'
          curl -s 'https://www.arcgis.com/sharing/rest/portals/JJzESW51TqeY9uat?f=json' | python3 -c 'import json,sys; d=json.load(sys.stdin); print("ORG", d.get("name"), d.get("urlKey"))'
          echo "== OML NZ shapefile names"
          curl -sL --max-time 300 -o oml.zip 'https://api.os.uk/downloads/v1/products/OpenMapLocal/downloads?area=NZ&format=ESRI%C2%AE+Shapefile&redirect'; unzip -l oml.zip | grep -iE 'build|licen|readme' | head
