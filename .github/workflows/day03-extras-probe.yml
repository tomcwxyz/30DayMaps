name: Day 03 extras source probe
on:
  push:
    branches: ["feat/day03-four-more-polygons"]
    paths: [".github/workflows/day03-extras-probe.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Probe boundaries, INSPIRE GML and CRoW values
        shell: bash
        run: |
          set +e
          curl -s 'https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services?f=json' | python3 -c 'import json,sys
          d=json.load(sys.stdin)
          print("SVC", [s["name"] for s in d["services"] if ("Local_Authority_Districts_December_202" in s["name"] or "Counties_and_Unitary_Authorities_December_202" in s["name"]) and "BGC" in s["name"]])'
          curl -sL -c jar -b jar --max-redirs 5 --max-time 200 -o n.zip 'https://use-land-property-data.service.gov.uk/datasets/inspire/download/Northumberland.zip'
          unzip -p n.zip Land_Registry_Cadastral_Parcels.gml | head -c 3000; echo
          echo "== GML count"; unzip -p n.zip Land_Registry_Cadastral_Parcels.gml | grep -c '<LR:PREDEFINED' 
          L='https://services.arcgis.com/JJzESW51TqeY9uat/arcgis/rest/services/CRoW_Act_2000_Access_Layer/FeatureServer/0/query'
          for fld in Descrip OC RCL S16; do
          curl -s -G "$L" --data-urlencode 'where=1=1' --data-urlencode 'geometry=360000,500000,480000,660000' --data-urlencode 'geometryType=esriGeometryEnvelope' --data-urlencode 'inSR=27700' \
            --data-urlencode "outFields=$fld" --data-urlencode 'returnDistinctValues=true' --data-urlencode 'returnGeometry=false' --data-urlencode 'f=json' | python3 -c "import json,sys; print('VAL $fld', [f['attributes'] for f in json.load(sys.stdin).get('features',[])][:30])"
          done
