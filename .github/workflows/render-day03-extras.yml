name: Day 03 polygon extras
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'maps/arcgis.py'
      - 'maps/polygon_frame.py'
      - 'maps/land_parcels.py'
      - 'maps/access_land.py'
      - 'maps/watersheds.py'
      - 'maps/footprints.py'
      - 'tests/test_polygon_extras.py'
      - '.github/workflows/render-day03-extras.yml'
  push:
    branches: ["feat/day03-four-more-polygons"]
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - {map: land_parcels, args: "--area northumberland", label: parcels-northumberland}
          - {map: land_parcels, args: "--area county-durham", label: parcels-county-durham}
          - {map: access_land, args: "", label: access_land}
          - {map: watersheds, args: "", label: watersheds}
          - {map: footprints, args: "", label: footprints}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_polygon_extras.py
      - name: Download and render
        env:
          PYTHONUNBUFFERED: '1'
        run: python -u -m maps.${{ matrix.map }} ${{ matrix.args }}
      - name: Small previews in the log (for checking without the artifact)
        if: always()
        run: |
          python - <<'PY'
          import base64, io, pathlib
          from PIL import Image
          for p in sorted(pathlib.Path("challenges/03-polygons/outputs").rglob("*.png")):
              im = Image.open(p).convert("RGB"); im.thumbnail((1200, 1200))
              buf = io.BytesIO(); im.save(buf, "JPEG", quality=72)
              print(f"PREVIEW-BEGIN {p}"); b = base64.b64encode(buf.getvalue()).decode(); print("\n".join(b[i:i+400] for i in range(0, len(b), 400))); print("PREVIEW-END")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: day03-${{ matrix.label }}
          path: challenges/03-polygons/outputs/
          if-no-files-found: warn
          retention-days: 30
