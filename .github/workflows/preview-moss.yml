name: Day 04 real map screenshots
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/preview_moss.mjs'
      - '.github/workflows/preview-moss.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/preview_moss.mjs'
      - '.github/workflows/preview-moss.yml'
      - 'web/moss/index.html'
      - 'web/moss/app.js'
      - 'web/moss/style.css'
      - 'web/moss/moss-clusters.geojson'
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser automation
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Render the actual map on desktop and phone
        shell: bash
        run: |
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/moss-server.log 2>&1 &
          echo $! >/tmp/moss-server.pid
          node scripts/preview_moss.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: day04-real-moss-preview
          path: |
            web/moss/preview-desktop.png
            web/moss/preview-mobile.png
          if-no-files-found: error
          retention-days: 30
      - name: Commit previews to the repository on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/moss/preview-desktop.png web/moss/preview-mobile.png
          if ! git diff --cached --quiet; then
            git commit -m "Preview: screenshots of real Day 04 moss cluster map"
            git push
          fi
