name: Map buses furthest from built-up areas
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'maps/settlements.py'
      - 'maps/buses.py'
      - 'maps/render.py'
      - '.github/workflows/render-settlements.yml'
      - 'tests/test_settlements.py'
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q
      - name: Generate second definition of loneliness from open data
        run: python -m maps.settlements
      - name: Attach ranking and map
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: england-bus-stops-from-mapped-settlement
          path: explorations/loneliest-bus-stops/outputs/furthest-from-settlement.*
          retention-days: 30