name: Publish interactive map challenges to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/moss/**'
      - 'web/day05-wildlife/**'
      - 'web/day05-dale-head/**'
      - 'maps/dale_head_viewshed.py'
      - 'maps/dale_head_peaks.py'
      - 'tests/test_dale_head_peaks.py'
      - 'tests/test_dale_head_viewshed.py'
      - 'pyproject.toml'
      - '.github/workflows/pages-moss.yml'
  pull_request:
    paths:
      - 'web/moss/**'
      - 'web/day05-wildlife/**'
      - 'web/day05-dale-head/**'
      - '.github/workflows/pages-moss.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: day04-github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the real moss map and NBN data
        uses: actions/checkout@v4

      - name: Verify the source-derived data and front-end
        run: |
          node --check web/moss/app.js
          node --check web/day05-wildlife/app.js
          node --check web/day05-wildlife/geo.js
          node --test tests/day05-geo.test.cjs
          node --check web/day05-dale-head/app.js
          python - <<'PY'
          import json
          from pathlib import Path

          source = json.loads(Path("web/moss/moss.geojson").read_text())
          clusters = json.loads(Path("web/moss/moss-clusters.geojson").read_text())
          meta = json.loads(Path("web/moss/moss-clusters-manifest.json").read_text())
          assert source["type"] == "FeatureCollection"
          assert clusters["type"] == "FeatureCollection"
          assert len(source["features"]) >= 100, "Missing real NBN source data"
          assert len(clusters["features"]) >= 10, "Missing source-derived clusters"
          assert meta["input_grids"] == len(source["features"])
          for feature in clusters["features"]:
              p = feature["properties"]
              assert p["cell_count"] >= 3
              assert len(p["grid_refs"]) == p["cell_count"]
          print(f"Verified {len(source['features'])} NBN grids and {len(clusters['features'])} cluster profiles")
          PY

      - name: Restore any already-calculated, reproducible Dale Head data
        id: viewshed-cache
        uses: actions/cache@v4
        with:
          path: web/day05-dale-head/data
          key: dale-head-terrain-v2-${{ hashFiles('maps/dale_head_viewshed.py', 'maps/dale_head_peaks.py') }}

      - name: Install real viewshed calculation tools
        if: steps.viewshed-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gdal-bin
          python -m pip install -q numpy Pillow requests pyproj rasterio

      - name: Calculate real Dale Head visibility from public terrain
        if: steps.viewshed-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          python -m maps.dale_head_viewshed \
            --output web/day05-dale-head/data \
            --radius-km 20 \
            --resolution-m 40 \
            --tile-zoom 12
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('web/day05-dale-head/data')
          meta = json.loads((root / 'viewshed-manifest.json').read_text())
          assert meta['status'] == 'computed'
          assert meta['cell_counts']['visible'] > 0
          assert meta['cell_counts']['hidden'] > 0
          for f in ['viewshed-overlay.png', 'dale-head-dem-bng.tif', 'dale-head-viewshed-bng.tif']:
              assert (root / f).stat().st_size > 1000, f
          print(f"Verified real GDAL viewshed: {meta['approx_visible_ground_area_km2']} km2 of visible ground")
          PY

      - name: Check named Lake District peaks against calculated sightlines
        if: steps.viewshed-cache.outputs.cache-hit != 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          test -s web/day05-dale-head/data/viewshed-manifest.json
          python -m maps.dale_head_peaks --data-dir web/day05-dale-head/data
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("web/day05-dale-head/data/peaks.json").read_text())
          assert d["status"] == "computed_from_real_data"
          assert d["raw_source_nodes"] > 0, "No actual OSM peak features returned"
          assert d["modelled_peaks"] > 0, "No mapped peaks checked against terrain"
          assert all(p["visibility"] == "visible" and p["gdal_visible"] and
                     p["independent_ray_visible"] for p in d["labelled_peaks"])
          print(f"Checked {d['modelled_peaks']} source peaks, {d['selected_label_count']} visible labels")
          PY

      - name: Report availability of computed viewshed
        run: |
          if test -s web/day05-dale-head/data/viewshed-manifest.json &&
             test -s web/day05-dale-head/data/viewshed-overlay.png; then
            echo "Computed Dale Head viewshed will be published"
          else
            echo "::warning::Dale Head viewshed computation is not available; the 3D terrain viewer will remain usable, with the visibility mode disabled"
            rm -rf web/day05-dale-head/data
          fi
          if test -s web/day05-dale-head/data/peaks.json; then
            echo "Visibility-checked named summits available"
          else
            echo "::warning::Named-summit source unavailable; no unverified names will be presented"
          fi

      - name: Prepare Day 04 moss and both Day 05 static experiences
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -a web/moss/. _site/
          mkdir -p _site/day05-wildlife _site/day05-dale-head
          cp -a web/day05-wildlife/. _site/day05-wildlife/
          cp -a web/day05-dale-head/. _site/day05-dale-head/
          touch _site/.nojekyll
          for file in index.html app.js style.css moss.geojson moss-manifest.json moss-clusters.geojson moss-clusters-manifest.json; do
            test -s "_site/$file"
          done
          for app in day05-wildlife day05-dale-head; do
            for file in index.html app.js style.css; do
              test -s "_site/$app/$file"
            done
          done
          test -s _site/day05-wildlife/geo.js

      - name: Upload GitHub Pages artefact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages (once enabled in repository settings)
        uses: actions/configure-pages@v5

      - name: Deploy static map experiences
        id: deployment
        uses: actions/deploy-pages@v4
