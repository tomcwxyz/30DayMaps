name: Peaks bake
# Bakes the default elevation grids of every ready-made place and route (web/peaks/baked),
# so they load as one file each instead of a hundred tiles. Run it on a bake/** branch.
on:
  push:
    branches: ["bake/**"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e ".[sight]" playwright && python -m playwright install --with-deps chromium
      - run: python web/peaks/test/harness.py bake
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A web/peaks/baked
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Peaks: bake ready-made grids"
          git pull --rebase --autostash -q && git push
