name: Peaks LiDAR
# Fetches EA LiDAR boxes listed in peaks/previews/lidar.txt and commits them to this branch.
on:
  push:
    branches: ["previews/**"]
    paths: ["peaks/previews/lidar.txt", "maps/peaks_lidar.py", ".github/workflows/peaks-lidar.yml"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e ".[sight]"
      - run: |
          mkdir -p peaks/previews/lidar
          python -m maps.peaks_lidar caps peaks/previews/lidar/caps.xml || true
          head -c 3000 peaks/previews/lidar/caps.xml || true
          while read slug e0 n0 e1 n1; do
            [ -z "$slug" ] && continue
            python -m maps.peaks_lidar fetch $e0 $n0 $e1 $n1 peaks/previews/lidar/$slug.npz
          done < peaks/previews/lidar.txt
      - name: Commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f peaks/previews/lidar
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Peaks LiDAR"
          git pull --rebase --autostash -q && git push
