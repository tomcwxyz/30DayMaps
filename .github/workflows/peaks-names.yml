name: Peaks names
on:
  push:
    branches: ["previews/**"]
    paths: ["maps/peaks_names.py", ".github/workflows/peaks-names.yml"]
permissions:
  contents: write
jobs:
  names:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m maps.peaks_names
      - run: |
          git config user.name "peaks-bot"; git config user.email "actions@github.com"
          git add web/peaks/names.json && git commit -qm "Baked summit names [skip ci]" && git push -q
