name: Peaks routes
# Rebuilds the ready-made route GPX files (web/peaks/routes) from maps/peak_routes.json:
# summits snapped to OpenStreetMap, legs routed on OSM paths by BRouter. Runs here because
# it needs Overpass and BRouter. Commits the new GPX files to the branch it ran on.
on:
  push:
    paths: ["maps/peak_routes.json", "maps/peaks_routes.py", ".github/workflows/peaks-routes.yml"]
  workflow_dispatch:
    inputs:
      slugs:
        description: "Route slugs to rebuild, separated by spaces (blank = all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: peaks-routes-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Build the routes
        env: {SLUGS: "${{ inputs.slugs }}"}
        run: |
          ALL=$(python -c "import json; print(' '.join(json.load(open('maps/peak_routes.json'))))")
          python -u -m maps.peaks_routes maps/peak_routes.json web/peaks/routes ${SLUGS:-$ALL}
      - name: Commit the routes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/peaks/routes/*.gpx
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Peaks: rebuild ready-made routes"
          git pull --rebase --autostash -q && git push
