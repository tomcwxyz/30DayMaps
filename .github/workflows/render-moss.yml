name: UK moss observations from NBN Atlas
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'maps/moss.py'
      - 'tests/test_moss.py'
      - '.github/workflows/render-moss.yml'
  push:
    branches: [main]
    paths:
      - 'maps/moss.py'
      - 'tests/test_moss.py'
      - '.github/workflows/render-moss.yml'
permissions:
  contents: write
jobs:
  moss:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]'
      - run: python -m pytest -q tests/test_moss.py
      - name: Fetch real open-licence NBN 10 km grid facets
        run: python -m maps.moss
      - uses: actions/upload-artifact@v4
        with:
          name: moss-nbn-atlas-grid-data
          path: |
            web/moss/moss.geojson
            web/moss/moss-manifest.json
          if-no-files-found: error
      - name: Commit source data snapshot
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/moss/moss.geojson web/moss/moss-manifest.json
          if ! git diff --cached --quiet; then
            git commit -m "Data: update open-licence NBN moss observations"
            git push
          fi
