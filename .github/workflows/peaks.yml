name: Peaks
# Downloads elevation and named summits for the places in maps/peak_places.json. Summit names
# and web/peaks/places.json are committed; the elevation grids are kept as the 'peaks-dem'
# artifact (download it into peaks/dem to draw prints locally). Drawing happens locally: python -m maps.peaks render.
on:
  push:
    paths: ["maps/peak_places.json", ".github/workflows/peaks.yml"]
  workflow_dispatch:
    inputs:
      slugs:
        description: "Place slugs to fetch, separated by spaces (blank = all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: peaks-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e ".[sight]"
      - name: Fetch elevation
        env: {SLUGS: "${{ inputs.slugs }}", PEAKS_NAMES_BUDGET_MIN: "60"}
        run: |
          if [ -n "$SLUGS" ]; then python -m maps.peaks fetch --force $SLUGS; else python -m maps.peaks fetch --all; fi
      - name: Refresh the print maker's places
        run: python -m maps.peaks web
      - name: Check places against OpenStreetMap (see the run summary)
        run: python -m maps.peaks_check
      - name: Bake summit names for the ready-made regions
        continue-on-error: true   # Overpass can be slow; the committed names.json stays as it was
        run: python -m maps.peaks_names
      - name: Keep the elevation grids as an artifact (too big for git)
        uses: actions/upload-artifact@v4
        with:
          name: peaks-dem
          path: peaks/dem/*.npz
          retention-days: 90
      - name: Commit summit names and places
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peaks/dem/*.names.json web/peaks/places.json web/peaks/names.json
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Peaks: summit names and places"
          git pull --rebase --autostash -q && git push
