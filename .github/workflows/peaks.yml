name: Peaks
# Downloads elevation and named summits for new places in maps/peak_places.json and
# commits them to the branch it ran on. Drawing happens locally: python -m maps.peaks render.
on:
  push:
    paths: ["maps/peak_places.json", ".github/workflows/peaks.yml"]
  workflow_dispatch:
    inputs:
      slugs:
        description: "Place slugs to fetch, separated by spaces (blank = all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: peaks-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e ".[sight]"
      - name: Fetch elevation
        env: {SLUGS: "${{ inputs.slugs }}"}
        run: |
          if [ -n "$SLUGS" ]; then python -m maps.peaks fetch --force $SLUGS; else python -m maps.peaks fetch --all; fi
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add peaks/dem
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Peaks: elevation and previews"
          git pull --rebase --autostash -q && git push
