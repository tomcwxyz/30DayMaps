name: Prepare footprint cities
# Rebuilds the ready-made city files the footprints page offers in its gallery, from
# OpenFreeMap tiles, draws their thumbnails, and commits them to the branch it ran on.
# It runs by itself when web/footprints/cities/cities.json changes; run it by hand now
# and then to pick up new OpenStreetMap mapping.
on:
  push:
    paths: ["web/footprints/cities/cities.json"]
  workflow_dispatch:
    inputs:
      cities:
        description: "City slugs to rebuild, separated by spaces (blank = all)"
        default: ""

permissions:
  contents: write

concurrency:
  group: footprint-cities-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Build city files
        env:
          CITIES: ${{ inputs.cities }}
        run: node web/footprints/lib/build-cities.js $CITIES
      - name: Draw thumbnails
        env:
          CITIES: ${{ inputs.cities }}
        run: python -m maps.city_thumbs $CITIES
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add web/footprints/cities
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Prepare footprint cities: ${CITIES:-all}"
          git push
        env:
          CITIES: ${{ inputs.cities }}
