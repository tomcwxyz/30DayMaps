name: Overpass CORS probe
on:
  push:
    branches: ["probe/overpass-cors"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - shell: bash
        run: |
          set +e
          SMALL='[out:json][timeout:60];way["building"](54.970,-1.615,54.975,-1.605);out geom;'
          BIG='[out:json][timeout:180];(way["building"](54.921,-1.692,55.026,-1.534);relation["building"]["type"="multipolygon"](54.921,-1.692,55.026,-1.534););out geom;'
          for url in https://overpass-api.de/api/interpreter https://overpass.private.coffee/api/interpreter https://overpass.kumi.systems/api/interpreter https://maps.mail.ru/osm/tools/overpass/api/interpreter; do
            for name in SMALL BIG; do
              q="${!name}"
              start=$(date +%s)
              curl -s -o body.json -D headers.txt --max-time 200 -X POST "$url" \
                -H 'Origin: https://30daymaps-footprints.vercel.app' \
                --data-urlencode "data=$q"
              code=$(head -1 headers.txt | awk '{print $2}')
              acao=$(grep -i '^access-control-allow-origin' headers.txt | tr -d '\r')
              size=$(stat -c %s body.json 2>/dev/null)
              echo "$name $url -> HTTP ${code:-none} | ${acao:-NO CORS HEADER} | ${size} bytes | $(( $(date +%s) - start ))s"
              [ "${code}" != "200" ] && head -c 300 body.json | tr '\n' ' ' && echo
            done
          done
          echo "== preflight check (JSON content type would trigger one)"
          curl -s -o /dev/null -D - -X OPTIONS https://overpass-api.de/api/interpreter -H 'Origin: https://30daymaps-footprints.vercel.app' -H 'Access-Control-Request-Method: POST' | grep -i -E '^HTTP|access-control'
