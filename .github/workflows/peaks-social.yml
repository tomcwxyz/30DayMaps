name: Peaks social
on:
  push:
    branches: ["previews/**"]
    paths: ["peaks/social/**", ".github/workflows/peaks-social.yml"]
permissions:
  contents: write
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ github.ref_name }}"}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: sudo apt-get update -q && sudo apt-get install -yq ffmpeg
      - run: python -m pip install -e ".[sight]" playwright pillow && python -m playwright install --with-deps chromium
      - run: python peaks/social/make.py peaks/previews/social stills clips
        shell: bash
      - name: Commit outputs
        run: |
          git config user.name "peaks-bot"; git config user.email "actions@github.com"
          git add peaks/previews/social && git commit -qm "Social renders [skip ci]" && git pull -q --rebase && git push -q || echo nothing
