<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Order Received · Peaks</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root { --bg: #EEEDE7; --fg: #1F2321; --muted: #646A66; --accent: #2F5D50; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #131917; --fg: #E7E9E3; --muted: #9AA39D; --accent: #79B39F; color-scheme: dark; } }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.55 "Jost", "Helvetica Neue", Arial, sans-serif;
  padding: 48px max(16px, env(safe-area-inset-right, 0px)) 48px max(16px, env(safe-area-inset-left, 0px)); }
main { max-width: 34rem; margin: 0 auto; display: grid; gap: 14px; }
h1 { font-weight: 700; font-size: 30px; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
.ref { font: 13px "IBM Plex Mono", ui-monospace, monospace; color: var(--muted); overflow-wrap: anywhere; }
a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1 id="head">Thanks, your print is ordered.</h1>
  <p id="line1">Each one is printed to order. You'll get a receipt by email now, and a tracking email when it's posted.</p>
  <p id="line2">If anything's wrong with your print when it arrives, reply to your receipt email and it'll be put right.</p>
  <p class="ref" id="ref"></p>
  <p><a href="./">Make another print</a></p>
</main>
<script>
  const q = new URLSearchParams(location.search), id = q.get("order");
  if (q.get("type") === "digital") {
    document.getElementById("head").textContent = "Thanks, your file is on its way.";
    document.getElementById("line1").textContent = "Your high-resolution file is being drawn now. It'll arrive by email, usually within 15 minutes, with links to the PNG and the PDF.";
    document.getElementById("line2").textContent = "Nothing after half an hour? Check your spam folder, then reply to your receipt email.";
  }
  if (id) document.getElementById("ref").textContent = "Order reference: " + id.slice(-12);
</script>
</body>
</html>
