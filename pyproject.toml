[project]
name = "30daymaps"
version = "0.1.0"
description = "Small reproducible cartographic investigations"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "requests>=2.31",
  "scipy>=1.13",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["maps", "maps.*"]
exclude = ["challenges*", "tests*"]
