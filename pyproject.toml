[project]
name = "30daymaps"
version = "0.1.0"
description = "Small reproducible cartographic investigations"
requires-python = ">=3.11"
dependencies = [
  "geopandas>=1.0",
  "matplotlib>=3.9",
  "pandas>=2.2",
  "requests>=2.31",
  "scipy>=1.13",
  "mapbox-vector-tile>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8", "Pillow>=11", "imageio>=2.36", "imageio-ffmpeg>=0.6", "rasterio>=1.3", "pyproj>=3.6", "numpy>=1.26"]
motion = ["Pillow>=11", "imageio>=2.36", "imageio-ffmpeg>=0.6"]
sight = ["rasterio>=1.3", "pyproj>=3.6", "numpy>=1.26", "Pillow>=11", "requests>=2.31"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["maps", "maps.*"]
exclude = ["challenges*", "tests*"]
